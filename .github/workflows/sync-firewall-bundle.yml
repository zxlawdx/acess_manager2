name: Sync firewall frontend bundle

on:
  push:
    branches:
      - fix/huawei-firewall-level-ui

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/huawei-firewall-level-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python tools/sync_frontend.py
      - name: Commit generated runtime
        shell: bash
        run: |
          if git diff --quiet -- apps/access_manager/static/js/runtime.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/access_manager/static/js/runtime.js
          git commit -m "build(ui): sync firewall runtime bundle"
          git push origin HEAD:fix/huawei-firewall-level-ui
