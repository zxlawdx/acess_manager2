name: Temporary Resolve PR28

on:
  push:
    branches:
      - feat/world3d-interactions-media-combat
    paths:
      - .github/workflows/resolve-pr28-temp.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/world3d-interactions-media-combat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Merge main, favor latest PR on conflicts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main || true
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo 'Merge did not enter merge state' >&2
            exit 1
          fi
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              git checkout --ours -- "$path"
              git add -- "$path"
            done <<< "$unresolved"
          fi
      - name: Reapply clipboard fixes while keeping PR28 world behavior
        shell: bash
        run: |
          git checkout origin/main -- \
            apps/access_manager/infrastructure/clipboard.py \
            apps/access_manager/static/js/shared/clipboard.js \
            apps/access_manager/static/js/workspaces/views/wifi.js \
            tests/frontend/aero-world.test.cjs \
            tests/frontend/clipboard-bridge.test.cjs \
            tests/frontend/human-service.test.cjs \
            tests/frontend/runtime.test.cjs
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'{label}: expected pattern not found')

          # Service panel: keep PR28's event, but always use PR27's desktop clipboard backend.
          path = Path('apps/access_manager/static/js/service/panel.js')
          text = path.read_text(encoding='utf-8')
          if "import {copyText} from '../shared/clipboard.js';" not in text:
              text = text.replace(
                  "import {service,startService,clearService,detachService,subscribeService,setServiceNotes,formatService,observeOperation} from './model.js';\n",
                  "import {service,startService,clearService,detachService,subscribeService,setServiceNotes,formatService,observeOperation} from './model.js';\nimport {copyText} from '../shared/clipboard.js';\n",
                  1,
              )
          text = text.replace('await navigator.clipboard.writeText(text);', 'await copyText(text);')
          if 'await copyText(text);' not in text:
              raise SystemExit('service copy does not use desktop clipboard backend')
          if "document.dispatchEvent(new CustomEvent('service-log-copied'))" not in text:
              text = text.replace(
                  "status('Registro copiado.');",
                  "status('Registro copiado.');document.dispatchEvent(new CustomEvent('service-log-copied'));",
                  1,
              )
          text = text.replace(
              "// Use the same Clipboard API path as the working Wi-Fi password copy.\n// Success is only reported after writeText resolves.\n",
              "// QtWebEngine clipboard ownership is avoided in packaged desktop builds.\n// Keep a manual Ctrl+C fallback if the desktop backend cannot copy.\n",
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Renderer: preserve all PR28 interactions/scenes, but keep PR27 Qt/WebGL stability fixes.
          path = Path('apps/access_manager/static/js/world/renderer.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});",
              "this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance',preserveDrawingBuffer:true});",
              'renderer constructor',
          )
          text = replace_once(
              text,
              "this.resizeObserver=new ResizeObserver(()=>this.resize());this.resizeObserver.observe(host);this.resize();this.updateCamera(1);",
              "this.resizeObserver=new ResizeObserver(()=>{if(this.resizeFrame)return;this.resizeFrame=requestAnimationFrame(()=>{this.resizeFrame=0;this.resize();});});this.resizeObserver.observe(host);this.resize();this.updateCamera(1);",
              'resize observer',
          )
          text = replace_once(
              text,
              "resize(){const w=this.host.clientWidth,h=this.host.clientHeight;if(!w||!h)return;this.renderer.setSize(w,h);this.camera.aspect=w/h;this.camera.updateProjectionMatrix();}",
              "resize(){const rawW=this.host.clientWidth,rawH=this.host.clientHeight;if(!rawW||!rawH)return;const w=Math.max(1,Math.round(rawW)),h=Math.max(1,Math.round(rawH));if(this.viewportWidth===w&&this.viewportHeight===h)return;this.viewportWidth=w;this.viewportHeight=h;this.renderer.setSize(w,h,false);this.camera.aspect=w/h;this.camera.updateProjectionMatrix();}",
              'resize method',
          )
          text = replace_once(
              text,
              "const hostRect=this.host.getBoundingClientRect(),hudRects=[...this.host.querySelector('.world-hud').children].filter(el=>!el.hidden).map(el=>el.getBoundingClientRect());\n   for(const {label,h} of this.labels){const v=new THREE.Vector3(h.x,terrainHeight(h.x,h.z)+4.6,h.z).project(this.camera),x=(v.x*.5+.5)*this.host.clientWidth,y=(-v.y*.5+.5)*this.host.clientHeight,w=Math.min(180,h.label.length*7+18);",
              "const hostRect=this.host.getBoundingClientRect(),viewW=this.host.clientWidth,viewH=this.host.clientHeight,hudRects=[...this.host.querySelector('.world-hud').children].filter(el=>!el.hidden).map(el=>el.getBoundingClientRect());\n   for(const {label,h} of this.labels){const v=new THREE.Vector3(h.x,terrainHeight(h.x,h.z)+4.6,h.z).project(this.camera),x=(v.x*.5+.5)*viewW,y=(-v.y*.5+.5)*viewH,w=Math.min(180,h.label.length*7+18);",
              'label dimensions',
          )
          text = text.replace(
              "x+w/2>this.host.clientWidth-8||y<35||y>this.host.clientHeight-70",
              "x+w/2>viewW-8||y<35||y>viewH-70",
              1,
          )
          old_dispose = "dispose(){this.disposed=true;this.stop();this.resizeObserver.disconnect();this.cleanups.forEach(fn=>fn());this.mixer?.stopAllAction();this.environmentSystem?.dispose();this.disposeObject(this.scene);this.environment?.dispose();this.skyTexture?.dispose();this.renderer.dispose();this.renderer.domElement.remove();this.labels?.forEach(({label})=>label.remove());}"
          new_dispose = "dispose(){this.disposed=true;this.stop();this.resizeObserver.disconnect();if(this.resizeFrame)cancelAnimationFrame(this.resizeFrame);this.resizeFrame=0;this.cleanups.forEach(fn=>fn());this.mixer?.stopAllAction();this.environmentSystem?.dispose();this.disposeObject(this.scene);this.environment?.dispose();this.skyTexture?.dispose();this.renderer.dispose();this.renderer.domElement.remove();this.labels?.forEach(({label})=>label.remove());}"
          text = replace_once(text, old_dispose, new_dispose, 'renderer dispose')
          path.write_text(text, encoding='utf-8')

          # Minimap: paint the background directly; no transparent clear frame between draws.
          path = Path('apps/access_manager/static/js/world/bridge.js')
          text = path.read_text(encoding='utf-8').replace("ctx.clearRect(0,0,180,180);", "", 1)
          path.write_text(text, encoding='utf-8')

          # Canvas compositing and glass stability from PR27, without touching PR28 immersive rules.
          path = Path('apps/access_manager/static/css/world.css')
          text = path.read_text(encoding='utf-8')
          old_canvas = '#aero-world>canvas:first-child{display:block;width:100%;height:100%;outline-offset:-4px;touch-action:none}'
          new_canvas = '#aero-world>canvas:first-child{display:block;position:absolute;inset:0;width:100%;height:100%;outline-offset:-4px;touch-action:none;transform:translateZ(0);backface-visibility:hidden}'
          if old_canvas in text:
              text = text.replace(old_canvas, new_canvas, 1)
          elif new_canvas not in text:
              raise SystemExit('world canvas stability rule not found')
          old_glass = '.world-glass{border:1px solid #ffffffd0!important;border-radius:16px!important;background:linear-gradient(#ffffffe8,#c8eeefd9)!important;box-shadow:0 5px 24px #17628830!important;color:#12384c!important;padding:12px 16px;backdrop-filter:blur(8px)}'
          new_glass = '.world-glass{border:1px solid #ffffffd0!important;border-radius:16px!important;background:linear-gradient(#fffffff2,#c8eeefea)!important;box-shadow:0 5px 24px #17628830!important;color:#12384c!important;padding:12px 16px}'
          if old_glass in text:
              text = text.replace(old_glass, new_glass, 1)
          elif new_glass not in text:
              raise SystemExit('world glass stability rule not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-subtests
          npm ci
      - name: Regenerate frontend bundles
        run: python tools/sync_frontend.py
      - name: Validate merged result
        run: |
          python tools/sync_frontend.py --check
          python tools/world3d_assets.py
          python -m pytest -q
          npm test
          git diff --check
      - name: Commit resolved merge and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/resolve-pr28-temp.yml
          git add -A
          git commit -m 'merge: resolve PR27 into latest world3d work'
          git push origin HEAD:feat/world3d-interactions-media-combat
