name: Temporary Clipboard Frontend Sync

on:
  push:
    branches:
      - fix/global-desktop-clipboard

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-desktop-clipboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python tools/sync_frontend.py
      - name: Commit generated frontend if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated frontend is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/access_manager/static/js/runtime.js apps/access_manager/static/js/world-runtime.js apps/access_manager/static/js/voxel-runtime.js apps/access_manager/static/js/wasteland-runtime.js
          git commit -m "build: sync frontend after clipboard fix"
          git push origin HEAD:fix/global-desktop-clipboard
