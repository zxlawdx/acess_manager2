name: Apply native clipboard fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-clipboard-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply clipboard patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

