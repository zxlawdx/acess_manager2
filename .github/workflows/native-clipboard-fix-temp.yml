name: Native clipboard migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-clipboard-fix-temp.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python tools/apply_clipboard_fix_temp.py
      - run: npm ci
      - run: python tools/sync_frontend.py
      - run: pip install -r requirements.txt pytest pytest-subtests
      - run: python -m pytest -q
      - run: npm test
      - name: Commit generated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/access_manager tests
          git commit -m 'fix: use native clipboard for all copy actions'
          git push origin HEAD:main
