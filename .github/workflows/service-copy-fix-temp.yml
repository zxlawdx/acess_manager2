name: Apply service clipboard fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/service-copy-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply copy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('apps/access_manager/static/js/service/panel.js')
          s = panel.read_text(encoding='utf-8')

          start = s.find('// Qt WebEngine / pywebview builds')
          end = s.find('function selectRecordForManualCopy', start)
          if start == -1 or end == -1:
              raise SystemExit('clipboard helper block not found')
          s = s[:start] + "// Use the same Clipboard API path as the working Wi-Fi password copy.\n// Success is only reported after writeText resolves.\n" + s[end:]

          old = """ panel.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{\n  const text=formatService({secrets,mode:b.dataset.copy==='technical'?'technical':panel.querySelector('[data-mode]').value,markdown:b.dataset.copy==='markdown'});\n  if(safeCopyText(text)){status('Registro copiado.');return}\n  selectRecordForManualCopy(panel);status('Cópia automática indisponível. O registro foi selecionado; pressione Ctrl+C.');\n });"""
          new = """ panel.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{\n  const text=formatService({secrets,mode:b.dataset.copy==='technical'?'technical':panel.querySelector('[data-mode]').value,markdown:b.dataset.copy==='markdown'});\n  try{\n   await navigator.clipboard.writeText(text);\n   status('Registro copiado.');\n  }catch{\n   selectRecordForManualCopy(panel);\n   status('Não foi possível copiar automaticamente. O registro foi selecionado; pressione Ctrl+C.');\n  }\n });"""
          if old not in s:
              raise SystemExit('service copy handler not found')
          panel.write_text(s.replace(old, new), encoding='utf-8')

          human = Path('tests/frontend/human-service.test.cjs')
          h = human.read_text(encoding='utf-8')
          old_test = "test('service copy avoids async Clipboard API inside the Vela WebView',()=>{const text=fs.readFileSync('apps/access_manager/static/js/service/panel.js','utf8');assert.doesNotMatch(text,/navigator\\.clipboard|clipboard\\.writeText/);assert.match(text,/execCommand\\(['\"]copy['\"]\\)/);assert.match(text,/safeCopyText/);assert.match(text,/Cópia automática indisponível/)});"
          new_test = "test('service copy uses the same Clipboard API as Wi-Fi and only confirms after writeText resolves',()=>{const text=fs.readFileSync('apps/access_manager/static/js/service/panel.js','utf8');assert.match(text,/await navigator\\.clipboard\\.writeText\\(text\\)/);assert.doesNotMatch(text,/execCommand|safeCopyText/);assert.match(text,/Registro copiado/);assert.match(text,/Não foi possível copiar automaticamente/)});"
          if old_test not in h:
              raise SystemExit('old service clipboard test not found')
          human.write_text(h.replace(old_test, new_test), encoding='utf-8')

          runtime_test = Path('tests/frontend/runtime.test.cjs')
          r = runtime_test.read_text(encoding='utf-8')
          marker = "service copy writes the formatted record through the same Clipboard API as Wi-Fi"
          if marker not in r:
              r += "\n\ntest('service copy writes the formatted record through the same Clipboard API as Wi-Fi',async()=>{const x=await boot();let copied=null;x.w.navigator.clipboard={writeText:async value=>{copied=value}};x.w.document.querySelector('#service-current').click();x.w.document.querySelector('#service-dialog [data-copy=\"selected\"]').click();await x.wait();assert.match(copied,/Atendimento iniciado/);assert.equal(x.w.document.querySelector('#service-dialog [data-status]').textContent,'Registro copiado.');x.w.close()});\n"
              runtime_test.write_text(r, encoding='utf-8')
          PY
      - run: npm ci
      - run: python tools/sync_frontend.py
      - run: pip install -r requirements.txt pytest pytest-subtests
      - run: python -m pytest -q
      - run: npm test
      - name: Commit fix and remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/service-copy-fix-temp.yml
          rm -f .github/workflows/native-clipboard-fix-temp.yml
          rm -f tools/apply_clipboard_fix_temp.py
          git add -A
          git commit -m 'fix: use working clipboard path for service copy buttons'
          git push origin HEAD:main
