name: Access Manager - Native release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para publicar; vazio gera somente artifacts'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || '') }}
  PACKAGE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || format('ci-{0}', github.run_number)) }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

jobs:
  validate:
    name: Validate before native builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux libraries required by Qt/WebEngine doctor
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libnss3 libgbm1 \
            libdbus-1-3 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcomposite1 libxdamage1 libxrandr2 libx11-xcb1
      - name: Install project and Vela build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pytest pytest-subtests
          python -m pip install 'PyInstaller>=6.16,<7' 'PyQt6>=6.8,<7' 'PyQt6-WebEngine>=6.8,<7' 'qtpy>=2.4,<3' jaraco.text jaraco.functools jaraco.context more-itertools
          npm ci
      - name: Resolve build version
        shell: bash
        run: echo "ACCESS_MANAGER_VERSION=${PACKAGE_LABEL#v}" >> "$GITHUB_ENV"
      - name: Preserve the existing validation contract
        run: |
          python tools/sync_frontend.py --check
          python -m pytest -q
          npm test
          node tests/visual/terminal-theme.cjs
          python manage.py collectstatic --no-tailwind
      - name: Compile Python and validate Vela distribution plan
        run: |
          python -m compileall -q apps config tests manage.py
          python manage.py doctor --gui qt6
          python manage.py buildapp --dry-run

  build-windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONUTF8: '1'
      QT_API: pyqt6
      PYWEBVIEW_GUI: qt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pytest pytest-subtests
          python -m pip install 'PyInstaller>=6.16,<7' 'PyQt6>=6.8,<7' 'PyQt6-WebEngine>=6.8,<7' 'qtpy>=2.4,<3' jaraco.text jaraco.functools jaraco.context more-itertools
          npm ci
          "ACCESS_MANAGER_VERSION=$($env:PACKAGE_LABEL.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare Windows native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Cross-platform tests already passed in the required validate job.
          # Keep this job focused on the Windows-native packaging path so an
          # existing tag can be rebuilt reliably via workflow_dispatch.
          python manage.py collectstatic --no-tailwind
          python manage.py doctor --gui qt6
          python manage.py buildapp --dry-run
      - name: Build native Vela application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python manage.py buildapp --gui qt6 --installer
      - name: Locate validated Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-ChildItem -Path dist -Recurse -File -Filter '.vela-app.json' | Select-Object -First 1
          if (-not $manifest) { throw 'Manifesto .vela-app.json não encontrado no bundle Vela.' }

          $appDir = $manifest.Directory.FullName
          $candidate = Get-ChildItem -Path $appDir -File -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'QtWebEngineProcess|unins|installer' } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $candidate) {
            $candidate = Get-ChildItem -Path $appDir -Recurse -File -Filter '*.exe' |
              Where-Object { $_.Name -notmatch 'QtWebEngineProcess|unins|installer' } |
              Sort-Object Length -Descending |
              Select-Object -First 1
          }

          if (-not $candidate) { throw 'Executável principal não encontrado no bundle Vela.' }

          # buildapp --gui qt6 --installer already performs the frozen runtime
          # self-test internally. Re-running the GUI executable here was the
          # source of the false-negative release failure on GitHub Windows.
          "APP_DIR=$appDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_EXE=$($candidate.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Bundle: $appDir"
          Write-Host "Executável: $($candidate.FullName)"
      - name: Verify physical Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "$env:APP_DIR\.vela-app.json",
            "$env:APP_DIR\apps\access_manager\templates\index.html",
            "$env:APP_DIR\staticfiles\access_manager\js\runtime.js",
            "$env:APP_DIR\staticfiles\access_manager\css\app.css",
            "$env:APP_DIR\config\settings.py",
            "$env:APP_EXE"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Arquivo crítico ausente: $path" } }
      - name: Package actual Vela bundle and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          $source = Get-ChildItem -Path dist -File -Filter '*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $source) { throw 'ZIP versionado do Vela não encontrado.' }
          $file = "AccessManager-$env:PACKAGE_LABEL-Windows-x86_64.zip"
          Copy-Item $source.FullName "release\$file" -Force
          $hash = (Get-FileHash "release\$file" -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Set-Content "release\$file.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AccessManager-Windows-${{ env.PACKAGE_LABEL }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-24.04
    env:
      QT_API: pyqt6
      PYWEBVIEW_GUI: qt
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install native Qt/WebEngine libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libnss3 libgbm1 \
            libdbus-1-3 libasound2t64 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcomposite1 libxdamage1 libxrandr2 libx11-xcb1 \
            libgl1-mesa-dri libxcb-shape0 zip xvfb xauth
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pytest pytest-subtests
          python -m pip install 'PyInstaller>=6.16,<7' 'PyQt6>=6.8,<7' 'PyQt6-WebEngine>=6.8,<7' 'qtpy>=2.4,<3' jaraco.text jaraco.functools jaraco.context more-itertools
          npm ci
          echo "ACCESS_MANAGER_VERSION=${PACKAGE_LABEL#v}" >> "$GITHUB_ENV"
      - name: Prepare and validate project
        run: |
          python tools/sync_frontend.py --check
          python -m pytest -q
          npm test
          python manage.py collectstatic --no-tailwind
          python manage.py doctor --gui qt6
          python manage.py buildapp --dry-run
      - name: Build native Vela application
        run: python manage.py buildapp --gui qt6 --installer
      - name: Locate bundle and run frozen self-test
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find dist -type f -name .vela-app.json -print -quit)"
          test -n "$manifest"
          app_dir="$(dirname "$manifest")"
          exe=''
          while IFS= read -r candidate; do
            case "$(basename "$candidate")" in Instalar*|*.sh|QtWebEngineProcess) continue;; esac
            if QT_QPA_PLATFORM=offscreen "$candidate" --self-test; then exe="$candidate"; break; fi
          done < <(find "$app_dir" -maxdepth 1 -type f -perm -111 -print)
          test -n "$exe"
          printf 'APP_DIR=%s\nAPP_EXE=%s\n' "$app_dir" "$exe" >> "$GITHUB_ENV"
      - name: Verify physical Linux bundle
        run: |
          test -f "$APP_DIR/.vela-app.json"
          test -f "$APP_DIR/apps/access_manager/templates/index.html"
          test -f "$APP_DIR/staticfiles/access_manager/js/runtime.js"
          test -f "$APP_DIR/staticfiles/access_manager/css/app.css"
          test -f "$APP_DIR/config/settings.py"
          find "$APP_DIR" -type f -name QtWebEngineProcess | grep -q .
      - name: Short native startup smoke under Xvfb
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=xcb timeout --signal=TERM 15s xvfb-run -a "$APP_EXE" > startup.log 2>&1
          code=$?
          set -e
          cat startup.log
          if [[ "$code" != 124 ]]; then
            echo "Aplicativo encerrou antes da janela de smoke (code=$code)." >&2
            exit 1
          fi
          if grep -Eqi 'ModuleNotFoundError|Could not initialize GLX|Traceback' startup.log; then
            echo 'Erro de runtime detectado no startup smoke.' >&2
            exit 1
          fi
      - name: Package actual Vela bundle and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          source_zip="$(find dist -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$source_zip"
          file="AccessManager-${PACKAGE_LABEL}-Linux-x86_64.zip"
          cp "$source_zip" "release/$file"
          (cd release && sha256sum "$file" > "$file.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: AccessManager-Linux-${{ env.PACKAGE_LABEL }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [validate, build-windows, build-linux]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify complete release set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test "$(find release -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 2
          for checksum in release/*.sha256; do (cd release && sha256sum -c "$(basename "$checksum")"); done
      - name: Create or update release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/* -R "$GITHUB_REPOSITORY" --title "Access Manager $RELEASE_TAG" --generate-notes
          fi
