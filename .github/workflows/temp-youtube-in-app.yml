name: Temporary YouTube In-App Patch

on:
  push:
    branches:
      - fix/youtube-search-in-app

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/youtube-search-in-app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: python tools/patch_youtube_in_app.py
      - run: python tools/sync_frontend.py
      - name: Commit generated frontend
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/access_manager/static/js/world/experience.js apps/access_manager/static/js/runtime.js apps/access_manager/static/js/world-runtime.js
          git diff --cached --check
          git commit -m 'fix(youtube): render search results inside Access Manager'
          git push origin HEAD:fix/youtube-search-in-app
