name: Temporary World Present Stabilization

on:
  push:
    branches:
      - fix/global-desktop-clipboard
    paths:
      - .github/workflows/stabilize-world-present-temp.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Stabilize Qt WebEngine canvas presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer_path = Path('apps/access_manager/static/js/world/renderer.js')
          renderer = renderer_path.read_text(encoding='utf-8')
          old_ctor = "this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});"
          new_ctor = "this.renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance',preserveDrawingBuffer:true});"
          if old_ctor in renderer:
              renderer = renderer.replace(old_ctor, new_ctor, 1)
          elif new_ctor not in renderer:
              raise SystemExit('renderer constructor pattern not found')

          old_labels = "const hostRect=this.host.getBoundingClientRect(),hudRects=[...this.host.querySelector('.world-hud').children].filter(el=>!el.hidden).map(el=>el.getBoundingClientRect());\n   for(const {label,h} of this.labels){const v=new THREE.Vector3(h.x,terrainHeight(h.x,h.z)+4.6,h.z).project(this.camera),x=(v.x*.5+.5)*this.host.clientWidth,y=(-v.y*.5+.5)*this.host.clientHeight,w=Math.min(180,h.label.length*7+18);"
          new_labels = "const hostRect=this.host.getBoundingClientRect(),viewW=this.host.clientWidth,viewH=this.host.clientHeight,hudRects=[...this.host.querySelector('.world-hud').children].filter(el=>!el.hidden).map(el=>el.getBoundingClientRect());\n   for(const {label,h} of this.labels){const v=new THREE.Vector3(h.x,terrainHeight(h.x,h.z)+4.6,h.z).project(this.camera),x=(v.x*.5+.5)*viewW,y=(-v.y*.5+.5)*viewH,w=Math.min(180,h.label.length*7+18);"
          if old_labels in renderer:
              renderer = renderer.replace(old_labels, new_labels, 1)
          elif new_labels not in renderer:
              raise SystemExit('label projection pattern not found')
          renderer = renderer.replace("x+w/2>this.host.clientWidth-8||y<35||y>this.host.clientHeight-70", "x+w/2>viewW-8||y<35||y>viewH-70")
          renderer_path.write_text(renderer, encoding='utf-8')

          bridge_path = Path('apps/access_manager/static/js/world/bridge.js')
          bridge = bridge_path.read_text(encoding='utf-8')
          old_clear = "if(ctx){ctx.clearRect(0,0,180,180);ctx.fillStyle="
          new_clear = "if(ctx){ctx.fillStyle="
          if old_clear in bridge:
              bridge = bridge.replace(old_clear, new_clear, 1)
          elif new_clear not in bridge:
              raise SystemExit('minimap clear pattern not found')
          bridge_path.write_text(bridge, encoding='utf-8')

          css_path = Path('apps/access_manager/static/css/world.css')
          css = css_path.read_text(encoding='utf-8')
          old_canvas = '#aero-world>canvas:first-child{display:block;position:absolute;inset:0;width:100%;height:100%;outline-offset:-4px;touch-action:none}'
          new_canvas = '#aero-world>canvas:first-child{display:block;position:absolute;inset:0;width:100%;height:100%;outline-offset:-4px;touch-action:none;transform:translateZ(0);backface-visibility:hidden}'
          if old_canvas in css:
              css = css.replace(old_canvas, new_canvas, 1)
          elif new_canvas not in css:
              raise SystemExit('canvas compositing pattern not found')
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/frontend/aero-world.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          addition = "\ntest('world renderer keeps the last WebGL frame stable for Qt composition',()=>{const renderer=fs.readFileSync('apps/access_manager/static/js/world/renderer.js','utf8'),bridge=fs.readFileSync('apps/access_manager/static/js/world/bridge.js','utf8'),css=fs.readFileSync('apps/access_manager/static/css/world.css','utf8');assert.match(renderer,/powerPreference:'high-performance'/);assert.match(renderer,/preserveDrawingBuffer:true/);assert.match(renderer,/viewW=this\\.host\\.clientWidth,viewH=this\\.host\\.clientHeight/);assert.doesNotMatch(bridge,/ctx\\.clearRect\\(0,0,180,180\\)/);assert.match(css,/#aero-world>canvas:first-child\\{[^}]*translateZ\\(0\\)/);});\n"
          if 'keeps the last WebGL frame stable for Qt composition' not in tests:
              test_path.write_text(tests.rstrip() + addition, encoding='utf-8')
          PY
      - name: Sync generated frontend bundle
        run: python tools/sync_frontend.py
      - name: Run 3D regression tests
        run: node --test tests/frontend/aero-world.test.cjs tests/frontend/world.test.cjs
      - name: Commit presentation stabilization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/access_manager/static/js/world/renderer.js apps/access_manager/static/js/world/bridge.js apps/access_manager/static/js/runtime.js apps/access_manager/static/css/world.css tests/frontend/aero-world.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stabilize WebGL frame presentation in Qt WebEngine'
          git push origin HEAD:fix/global-desktop-clipboard
