name: Validate NetPulse
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.txt pytest pytest-subtests
      - run: npm ci
      - run: python tools/sync_frontend.py --check
      - run: python -m pytest -q
      - run: npm test
      - run: python manage.py collectstatic --no-tailwind
