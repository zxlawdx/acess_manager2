name: Temporary YouTube Native Search Patch

on:
  push:
    branches:
      - fix/youtube-native-search-window

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/youtube-native-search-window
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch real YouTube search flow
        run: python tools/patch_youtube_native_search.py
      - name: Sync generated frontend bundles
        run: python tools/sync_frontend.py
      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/access_manager/static/js/world/experience.js apps/access_manager/static/js/runtime.js apps/access_manager/static/js/world-runtime.js
          git diff --cached --check
          git commit -m 'fix(youtube): use real YouTube search window in desktop build'
          git push origin HEAD:fix/youtube-native-search-window
