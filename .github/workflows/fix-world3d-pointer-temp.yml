name: Temporary World3D Pointer Fix

on:
  push:
    branches:
      - fix/world3d-combat-youtube-tv
    paths:
      - .github/workflows/fix-world3d-pointer-temp.yml
      - tools/_fix_world3d_visual.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world3d-combat-youtube-tv
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply visual and third-person interaction patch
        run: python tools/_fix_world3d_visual.py
      - name: Synchronize generated frontend bundle
        run: python tools/sync_frontend.py
      - run: npm ci
      - name: Verify 3D visual smoke
        run: node tests/visual/world-interactions.cjs
      - name: Commit fix and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-world3d-pointer-temp.yml tools/_fix_world3d_visual.py
          git add -A
          git commit -m 'fix(world3d): keep third-person interactions and embedded TV stable'
          git push origin HEAD:fix/world3d-combat-youtube-tv
