name: Temporary World3D Pointer Fix

on:
  push:
    branches:
      - fix/world3d-combat-youtube-tv
    paths:
      - .github/workflows/fix-world3d-pointer-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world3d-combat-youtube-tv
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fix passive overlay pointer events
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/access_manager/static/css/world.css')
          text=path.read_text(encoding='utf-8')
          rule='.world-experience-ui>.world-crosshair,.world-experience-ui>#world-connection,.world-experience-ui>#world-speech{pointer-events:none}\n'
          if rule not in text:
              text += '\n'+rule
          path.write_text(text,encoding='utf-8')
          PY
      - run: npm ci
      - name: Verify 3D visual smoke
        run: node tests/visual/world-interactions.cjs
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-world3d-pointer-temp.yml
          git add -A
          git commit -m 'fix(world3d): keep passive overlays from intercepting input'
          git push origin HEAD:fix/world3d-combat-youtube-tv
