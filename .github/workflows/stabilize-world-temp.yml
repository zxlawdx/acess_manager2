name: Temporary World Renderer Stabilization

on:
  push:
    branches:
      - fix/global-desktop-clipboard
    paths:
      - .github/workflows/stabilize-world-temp.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Stabilize WebGL canvas compositing and resize lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer_path = Path('apps/access_manager/static/js/world/renderer.js')
          renderer = renderer_path.read_text(encoding='utf-8')

          old_observer = "this.resizeObserver=new ResizeObserver(()=>this.resize());this.resizeObserver.observe(host);this.resize();this.updateCamera(1);"
          new_observer = "this.resizeObserver=new ResizeObserver(()=>{if(this.resizeFrame)return;this.resizeFrame=requestAnimationFrame(()=>{this.resizeFrame=0;this.resize();});});this.resizeObserver.observe(host);this.resize();this.updateCamera(1);"
          if old_observer not in renderer:
              raise SystemExit('resize observer pattern not found')
          renderer = renderer.replace(old_observer, new_observer, 1)

          old_resize = "resize(){const w=this.host.clientWidth,h=this.host.clientHeight;if(!w||!h)return;this.renderer.setSize(w,h);this.camera.aspect=w/h;this.camera.updateProjectionMatrix();}"
          new_resize = "resize(){const rawW=this.host.clientWidth,rawH=this.host.clientHeight;if(!rawW||!rawH)return;const w=Math.max(1,Math.round(rawW)),h=Math.max(1,Math.round(rawH));if(this.viewportWidth===w&&this.viewportHeight===h)return;this.viewportWidth=w;this.viewportHeight=h;this.renderer.setSize(w,h,false);this.camera.aspect=w/h;this.camera.updateProjectionMatrix();}"
          if old_resize not in renderer:
              raise SystemExit('resize method pattern not found')
          renderer = renderer.replace(old_resize, new_resize, 1)

          old_dispose = "dispose(){this.disposed=true;this.stop();this.resizeObserver.disconnect();this.cleanups.forEach(fn=>fn());"
          new_dispose = "dispose(){this.disposed=true;this.stop();this.resizeObserver.disconnect();if(this.resizeFrame)cancelAnimationFrame(this.resizeFrame);this.resizeFrame=0;this.cleanups.forEach(fn=>fn());"
          if old_dispose not in renderer:
              raise SystemExit('dispose pattern not found')
          renderer = renderer.replace(old_dispose, new_dispose, 1)
          renderer_path.write_text(renderer, encoding='utf-8')

          css_path = Path('apps/access_manager/static/css/world.css')
          css = css_path.read_text(encoding='utf-8')
          old_canvas = '#aero-world>canvas:first-child{display:block;width:100%;height:100%;outline-offset:-4px;touch-action:none}'
          new_canvas = '#aero-world>canvas:first-child{display:block;position:absolute;inset:0;width:100%;height:100%;outline-offset:-4px;touch-action:none}'
          if old_canvas not in css:
              raise SystemExit('world canvas css pattern not found')
          css = css.replace(old_canvas, new_canvas, 1)
          old_glass = '.world-glass{border:1px solid #ffffffd0!important;border-radius:16px!important;background:linear-gradient(#ffffffe8,#c8eeefd9)!important;box-shadow:0 5px 24px #17628830!important;color:#12384c!important;padding:12px 16px;backdrop-filter:blur(8px)}'
          new_glass = '.world-glass{border:1px solid #ffffffd0!important;border-radius:16px!important;background:linear-gradient(#fffffff2,#c8eeefea)!important;box-shadow:0 5px 24px #17628830!important;color:#12384c!important;padding:12px 16px}'
          if old_glass not in css:
              raise SystemExit('world glass css pattern not found')
          css = css.replace(old_glass, new_glass, 1)
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/frontend/aero-world.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          addition = "\ntest('world renderer avoids Qt WebEngine resize and backdrop-filter flicker paths',()=>{const renderer=fs.readFileSync('apps/access_manager/static/js/world/renderer.js','utf8'),css=fs.readFileSync('apps/access_manager/static/css/world.css','utf8');assert.match(renderer,/setSize\\(w,h,false\\)/);assert.match(renderer,/resizeFrame=requestAnimationFrame/);assert.match(renderer,/viewportWidth===w&&this\\.viewportHeight===h/);assert.match(css,/#aero-world>canvas:first-child\\{[^}]*position:absolute/);const glass=css.match(/\\.world-glass\\{[^}]*\\}/)?.[0]||'';assert.doesNotMatch(glass,/backdrop-filter/);});\n"
          if 'avoids Qt WebEngine resize and backdrop-filter flicker paths' not in tests:
              test_path.write_text(tests.rstrip() + addition, encoding='utf-8')
          PY
      - name: Sync generated frontend bundle
        run: python tools/sync_frontend.py
      - name: Run world regression tests
        run: node --test tests/frontend/aero-world.test.cjs tests/frontend/world.test.cjs
      - name: Commit stabilization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/access_manager/static/js/world/renderer.js apps/access_manager/static/js/runtime.js apps/access_manager/static/css/world.css tests/frontend/aero-world.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stabilize 3d rendering in packaged Qt WebEngine'
          git push origin HEAD:fix/global-desktop-clipboard
