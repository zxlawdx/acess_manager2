name: Temporary World3D Combat TV Fix

on:
  push:
    branches:
      - fix/world3d-combat-youtube-tv
    paths:
      - .github/workflows/fix-world3d-combat-tv-temp.yml
      - tools/_fix_world3d_combat_tv.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world3d-combat-youtube-tv
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply source patch
        run: python tools/_fix_world3d_combat_tv.py
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-subtests
          npm ci
      - name: Synchronize generated bundles
        run: python tools/sync_frontend.py
      - name: Validate implementation
        run: |
          python tools/sync_frontend.py --check
          python tools/world3d_assets.py
          python -m pytest -q
          npm test
          git diff --check
      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-world3d-combat-tv-temp.yml tools/_fix_world3d_combat_tv.py
          git add -A
          git commit -m 'fix(world3d): stabilize combat and embed searchable YouTube TV'
          git push origin HEAD:fix/world3d-combat-youtube-tv
